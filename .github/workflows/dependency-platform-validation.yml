name: Dependency Platform Validation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop bindings (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-26-intel, macos-latest]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      CI: "true"
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2.9.2
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.15"
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.2"
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: dart-lang/setup-dart@v1.8.1
        with:
          sdk: "3.13.5"
      - name: Install native compiler dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev pkg-config
      - name: Select npm stable
        run: npm install --global npm@12.2.0
      - name: Build and test desktop projects
        run: python scripts/validate_dependency_platform.py
