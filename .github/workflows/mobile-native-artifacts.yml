name: Mobile Native Artifacts

on:
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  flutter-package:
    name: Flutter package validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.7"

      - name: Analyze Dart package
        run: |
          cd bindings/dart/dart
          dart pub get
          dart analyze

      - name: Test Flutter package
        run: |
          cd bindings/dart/flutter
          flutter pub get
          flutter analyze
          flutter test

      - name: Analyze Flutter example
        working-directory: bindings/dart/flutter/example
        run: flutter pub get && flutter analyze

  android:
    name: Android mobile artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Java 25 LTS
        uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: "25"

      - name: Set artifact root
        run: echo "MOBILE_ARTIFACT_ROOT=$RUNNER_TEMP/decentdb-mobile-artifacts/android" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.7"

      - name: Prepare Android targets
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android

      - name: Install Android NDK r30 LTS and platform SDK
        run: |
          sdkmanager "ndk;30.0.16248370" "platforms;android-37"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"

      - name: Build Android artifacts
        run: |
          chmod +x bindings/dart/scripts/build_mobile_android.sh \
            bindings/dart/scripts/check_mobile_artifacts.sh \
            bindings/dart/scripts/mobile_benchmark_guardrails.sh
          bash bindings/dart/scripts/build_mobile_android.sh \
            --artifact-root "$MOBILE_ARTIFACT_ROOT" \
            --strict

      - name: Validate Android artifacts
        run: |
          bash bindings/dart/scripts/check_mobile_artifacts.sh \
            --platform android \
            --artifact-root "$MOBILE_ARTIFACT_ROOT" \
            --strict

      - name: Build Flutter Android example
        run: |
          bash bindings/dart/scripts/install_mobile_artifacts.sh --android-root "$MOBILE_ARTIFACT_ROOT"
          cd bindings/dart/flutter/example
          flutter create --platforms=android --project-name decentdb_flutter_example --no-pub .
          flutter build apk --debug --target-platform android-arm64,android-x64

      - name: Record Android guardrails
        run: |
          bash bindings/dart/scripts/mobile_benchmark_guardrails.sh \
            --android-root "$MOBILE_ARTIFACT_ROOT" \
            --ios-root "$RUNNER_TEMP/missing-ios" \
            --output "$MOBILE_ARTIFACT_ROOT/mobile-guardrails.json"

      - name: Package Android artifacts
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME:-}" == "release" ]]; then
            TAG="$(python3 - <<'PY'
          import json
          import os
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
              print(json.load(event_file)["release"]["tag_name"])
          PY
          )"
          elif [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="manual-${GITHUB_RUN_NUMBER}"
          fi
          ARTIFACT_NAME="decentdb-mobile-android-${TAG}.zip"
          ARTIFACT_PATH="$RUNNER_TEMP/$ARTIFACT_NAME"
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> "$GITHUB_ENV"
          echo "ARTIFACT_PATH=$ARTIFACT_PATH" >> "$GITHUB_ENV"
          cd "$MOBILE_ARTIFACT_ROOT"
          zip -r "$ARTIFACT_PATH" .

      - name: Upload Android artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_PATH }}
          if-no-files-found: error

  ios:
    name: iOS mobile artifacts
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set artifact root
        run: echo "MOBILE_ARTIFACT_ROOT=$RUNNER_TEMP/decentdb-mobile-artifacts/ios" >> "$GITHUB_ENV"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.7"

      - name: Prepare iOS targets
        run: |
          rustup target add aarch64-apple-ios x86_64-apple-ios

      - name: Build iOS artifacts
        run: |
          chmod +x bindings/dart/scripts/build_mobile_ios.sh \
            bindings/dart/scripts/check_mobile_artifacts.sh \
            bindings/dart/scripts/mobile_benchmark_guardrails.sh
          bash bindings/dart/scripts/build_mobile_ios.sh \
            --artifact-root "$MOBILE_ARTIFACT_ROOT" \
            --strict

      - name: Validate iOS artifacts
        run: |
          bash bindings/dart/scripts/check_mobile_artifacts.sh \
            --platform ios \
            --artifact-root "$MOBILE_ARTIFACT_ROOT" \
            --strict

      - name: Build Flutter iOS example
        run: |
          bash bindings/dart/scripts/install_mobile_artifacts.sh --ios-root "$MOBILE_ARTIFACT_ROOT"
          cd bindings/dart/flutter/example
          flutter create --platforms=ios --project-name decentdb_flutter_example --no-pub .
          flutter build ios --release --no-codesign

      - name: Record iOS guardrails
        run: |
          bash bindings/dart/scripts/mobile_benchmark_guardrails.sh \
            --android-root "$RUNNER_TEMP/missing-android" \
            --ios-root "$MOBILE_ARTIFACT_ROOT" \
            --output "$MOBILE_ARTIFACT_ROOT/mobile-guardrails.json"

      - name: Package iOS artifacts
        run: |
          set -euo pipefail
          if [[ "${GITHUB_EVENT_NAME:-}" == "release" ]]; then
            TAG="$(python3 - <<'PY'
          import json
          import os
          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
              print(json.load(event_file)["release"]["tag_name"])
          PY
          )"
          elif [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="manual-${GITHUB_RUN_NUMBER}"
          fi
          ARTIFACT_NAME="decentdb-mobile-ios-${TAG}.zip"
          ARTIFACT_PATH="$RUNNER_TEMP/$ARTIFACT_NAME"
          echo "ARTIFACT_NAME=$ARTIFACT_NAME" >> "$GITHUB_ENV"
          echo "ARTIFACT_PATH=$ARTIFACT_PATH" >> "$GITHUB_ENV"
          cd "$MOBILE_ARTIFACT_ROOT"
          zip -r "$ARTIFACT_PATH" .

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_PATH }}
          if-no-files-found: error
