name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: github.event_name != 'push' || !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.9.2

      - name: Format Check
        shell: bash
        run: |
          set -o pipefail
          if ! cargo fmt --check 2>&1 | tee /tmp/fmt-check.log; then
            echo "::error::Code formatting issues detected"
            echo "::group::Details"
            cat /tmp/fmt-check.log
            echo "::endgroup::"
            exit 1
          fi

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Vendored Header Drift Check
        run: python3 scripts/check_vendored_headers.py

  msrv:
    if: github.event_name != 'push' || !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Rust (MSRV)
        # Keep in sync with rust-version in the workspace Cargo.toml.
        uses: dtolnay/rust-toolchain@1.99.1

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.9.2

      - name: MSRV Check
        run: cargo check --workspace --all-targets

  supply-chain:
    if: github.event_name != 'push' || !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2.87.29
        with:
          tool: cargo-deny

      - name: cargo deny check
        run: |
          cargo deny check
          cargo deny --manifest-path benchmarks/rust-baseline/Cargo.toml check
          cargo deny --manifest-path fuzz/Cargo.toml check

      - name: Check independent Rust workspaces
        run: |
          cargo clippy --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings
          cargo clippy --manifest-path benchmarks/rust-baseline/Cargo.toml --all-targets --all-features -- -D warnings

  test:
    if: github.event_name != 'push' || !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.9.2

      - name: Engine & CLI Tests
        run: cargo test --workspace

  web-wasm-smoke:
    if: github.event_name != 'push' || !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2.9.2

      - name: Install Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "24.22.0"
          cache: npm
          cache-dependency-path: bindings/web/package-lock.json

      - name: Install wasm-bindgen CLI
        run: bash scripts/install_wasm_bindgen.sh 0.2.129

      - name: Build web package
        working-directory: bindings/web
        run: |
          npm ci
          npm run build

      - name: Build wasm package artifact
        run: |
          cargo build -p decentdb --target wasm32-unknown-unknown --release
          wasm-bindgen target/wasm32-unknown-unknown/release/decentdb.wasm \
            --target web \
            --out-dir bindings/web/dist \
            --out-name decentdb_wasm

      - name: Install browser
        working-directory: bindings/web
        run: npm run browser:install:ci

      - name: Browser OPFS smoke
        working-directory: bindings/web
        run: npm run browser:smoke:ci
