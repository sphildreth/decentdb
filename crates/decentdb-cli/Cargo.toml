[package]
name = "decentdb-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
decentdb = { path = "../decentdb" }
clap.workspace = true
anyhow.workspace = true
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
rustyline.workspace = true
ureq.workspace = true
mimalloc = { version = "0.1.52", default-features = false, optional = true }

[features]
# Opt-in low-fragmentation allocator. See ADR 0139.
mimalloc = ["dep:mimalloc"]

[[bin]]
name = "decentdb"
path = "src/main.rs"
# The executable has CLI documentation; Rust API docs belong to the engine lib.
doc = false
