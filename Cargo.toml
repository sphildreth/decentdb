[workspace]
members = [
    "crates/decentdb",       # Core database engine
    "crates/decentdb-cli",   # CLI application
    "crates/decentdb-benchmark", # Rust-native benchmark runner
    "crates/libpg_query_sys",    # Pinned SQL parser wrapper
    "crates/decentdb-migrate",   # Migration tooling
]
exclude = [
    "benchmarks/rust-baseline",   # Standalone baseline benchmark (not part of main workspace)
]
resolver = "2"

[workspace.package]
version = "3.0.0"
edition = "2021"
rust-version = "1.99.1"
authors = ["Steven Hildreth"]
license = "Apache-2.0"
repository = "https://github.com/sphildreth/decentdb"

[workspace.dependencies]
# Error handling
thiserror = "2.0.21"
anyhow = "1.0.104"
miniz_oxide = "0.9.1"

# CLI
clap = { version = "4.6.7", features = ["derive"] }
rustyline = "18.0.1"
ureq = { version = "3.4.2", features = ["json"] }
