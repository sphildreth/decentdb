plugins {
    id 'com.android.library'
}

group = 'dev.decentdb.decentdb_flutter'
version = '3.0.0'

android {
    namespace 'dev.decentdb.decentdb_flutter'
    compileSdk 37

    defaultConfig {
        minSdk 26
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
