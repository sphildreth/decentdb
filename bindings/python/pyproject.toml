[build-system]
requires = ["setuptools>=84.0.0", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "decentdb"
version = "3.0.0"
description = "Python DB-API 2.0 driver and SQLAlchemy dialect for DecentDB"
license = "Apache-2.0"
readme = "README.md"
authors = [
  { name = "DecentDB Contributors" },
]
classifiers = [
  "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.12"
dependencies = [
    "SQLAlchemy>=2.1.4",
  "rich>=15.0.0",
]

[project.optional-dependencies]
test = ["pytest>=9.1.1", "psutil>=7.2.2", "setuptools>=84.0.0"]

[project.scripts]
decentdb-sqlite-import = "decentdb.tools.sqlite_import:main"
decentdb-pgbak-import = "decentdb.tools.pgbak_import:main"

[project.entry-points."sqlalchemy.dialects"]
decentdb = "decentdb_sqlalchemy.dialect:DecentDBDialect"
"decentdb.pysql" = "decentdb_sqlalchemy.dialect:DecentDBDialect"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.setuptools.packages.find]
where = ["."]
include = ["decentdb*", "decentdb_sqlalchemy*"]
exclude = ["tests*", "benchmarks*", "__pycache__*"]
