# cargo-deny configuration for DecentDB supply-chain checks.
# Run locally with: cargo deny check

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
# Known vulnerabilities are denied by default in cargo-deny 0.20+; list any
# deliberate, reasoned exceptions here.
ignore = []

[licenses]
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    # Permissive data license used by the webpki-roots certificate bundles.
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
